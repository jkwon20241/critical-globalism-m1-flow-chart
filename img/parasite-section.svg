<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="ABC Repro Trial, ABC Repro, Helvetica Neue, Arial, sans-serif">
  <title>Section diagram of Parasite’s vertical geography</title>
  <rect width="640" height="360" fill="#333336"/>
  <!-- rain -->
  <g stroke="#B9B8B2" stroke-width="1.2" stroke-linecap="round" opacity=".45">
    <path d="M30 8l-6 16M90 14l-6 16M150 6l-6 16M210 18l-6 16M270 4l-6 16M330 16l-6 16M390 8l-6 16M450 20l-6 16M510 6l-6 16M570 14l-6 16M620 4l-6 16"/>
    <path d="M300 60l-6 16M360 74l-6 16M420 62l-6 16M480 80l-6 16M540 66l-6 16M600 84l-6 16M330 110l-6 16M390 124l-6 16M450 112l-6 16M510 130l-6 16M570 118l-6 16M620 150l-6 16M420 170l-6 16M480 182l-6 16M560 176l-6 16"/>
  </g>
  <!-- ground: high on the left, stairs down to the low street on the right -->
  <path d="M0 140H250V158.3H275V176.7H300V195H325V213.3H350V231.7H375V250H640V360H0Z" fill="#3E3E42" stroke="#7B7B7F" stroke-width="1.5"/>
  <!-- "the line" -->
  <path d="M0 140H640" stroke="#F2F1EC" stroke-width="1.2" stroke-dasharray="6 5" opacity=".75"/>
  <text x="632" y="132" fill="#F2F1EC" font-size="13" font-style="italic" text-anchor="end">“the line”</text>
  <!-- the Parks' house -->
  <rect x="40" y="62" width="190" height="78" fill="#2B2B2D" stroke="#9AD58B" stroke-width="2"/>
  <rect x="64" y="80" width="142" height="40" fill="none" stroke="#9AD58B" stroke-width="1.2"/>
  <text x="40" y="52" fill="#9AD58B" font-size="15" font-weight="700">The Parks’ house</text>
  <!-- bunker beneath -->
  <path d="M135 140V190" stroke="#9AD58B" stroke-width="1.2" stroke-dasharray="3 4"/>
  <rect x="90" y="190" width="90" height="44" fill="#2B2B2D" stroke="#9AD58B" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="135" y="217" fill="#9AD58B" font-size="13" font-weight="700" text-anchor="middle">Bunker</text>
  <text x="135" y="256" fill="#B9B8B2" font-size="12" text-anchor="middle">Geun-sae, hiding from debt</text>
  <!-- stairs label -->
  <text x="300" y="140" fill="#B9B8B2" font-size="12" font-style="italic" transform="rotate(36 300 140)" dx="-6" dy="-8">the stairs down</text>
  <!-- the Kims' semi-basement, half below the street -->
  <rect x="440" y="214" width="150" height="72" fill="#2B2B2D" stroke="#9AD58B" stroke-width="2"/>
  <rect x="441" y="238" width="148" height="47" fill="#6F93A6" opacity=".55"/>
  <rect x="456" y="222" width="58" height="24" fill="none" stroke="#9AD58B" stroke-width="1.2"/>
  <text x="440" y="204" fill="#9AD58B" font-size="15" font-weight="700">The Kims’ semi-basement</text>
  <text x="515" y="276" fill="#F2F1EC" font-size="12" text-anchor="middle">flood water</text>
  <text x="600" y="246" fill="#B9B8B2" font-size="11" font-style="italic">street</text>
  <text x="20" y="340" fill="#B9B8B2" font-size="11">Diagram after Bong Joon Ho, Parasite (2019)</text>
</svg>
